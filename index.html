<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rock Player</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background:
    radial-gradient(circle at 20% 20%, #252525 0%, transparent 30%),
    radial-gradient(circle at 80% 80%, #1c1c1c 0%, transparent 30%),
    linear-gradient(135deg, #050505, #111, #050505);
  color: white;
  font-family: Arial, Helvetica, sans-serif;
  overflow-x: hidden;
}

body::before {
  content: "";
  position: fixed;
  top: 0;
  left: 8%;
  width: 1px;
  height: 100%;
  background: rgba(255,255,255,0.15);
  box-shadow:
    120px 0 rgba(255,255,255,0.10),
    240px 0 rgba(255,255,255,0.08),
    360px 0 rgba(255,255,255,0.06),
    480px 0 rgba(255,255,255,0.05),
    600px 0 rgba(255,255,255,0.04),
    720px 0 rgba(255,255,255,0.03);
  pointer-events: none;
}

.bg-text {
  position: fixed;
  font-weight: 900;
  color: rgba(255,255,255,0.035);
  font-size: 80px;
  letter-spacing: 8px;
  transform: rotate(-12deg);
  pointer-events: none;
  user-select: none;
  z-index: 0;
}

.bg1 {
  top: 8%;
  left: -10px;
}

.bg2 {
  bottom: 18%;
  right: -30px;
  transform: rotate(12deg);
}

.bg3 {
  top: 48%;
  left: -30px;
  font-size: 55px;
  transform: rotate(-8deg);
}

.container {
  position: relative;
  z-index: 2;
  width: 100%;
  max-width: 520px;
  margin: auto;
  padding: 25px 18px 40px;
}

.tags {
  display: flex;
  justify-content: center;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 20px;
}

.tag {
  border: 1px solid #555;
  padding: 6px 12px;
  border-radius: 20px;
  font-size: 11px;
  letter-spacing: 1px;
  color: #ddd;
  background: rgba(0,0,0,0.5);
}

h1 {
  text-align: center;
  margin: 10px 0 25px;
  font-size: 32px;
  letter-spacing: 4px;
  text-transform: uppercase;
}

.cover {
  width: 240px;
  height: 240px;
  margin: auto;
  border-radius: 50%;
  border: 3px solid #555;
  box-shadow:
    0 0 0 8px rgba(255,255,255,0.03),
    0 15px 50px rgba(0,0,0,0.8);
  position: relative;
  overflow: hidden;
  background: #111;
}

.cover img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.cover::before {
  content: "";
  position: absolute;
  inset: 0;
  background:
    radial-gradient(
      circle,
      transparent 0 8%,
      rgba(0,0,0,0.20) 8.5% 9%,
      transparent 9.5% 20%,
      rgba(0,0,0,0.15) 20.5% 21%,
      transparent 21.5% 34%,
      rgba(0,0,0,0.12) 34.5% 35%,
      transparent 35.5% 48%
    );
  pointer-events: none;
  z-index: 2;
}

.cover::after {
  content: "";
  position: absolute;
  width: 16px;
  height: 16px;
  background: #111;
  border: 3px solid #777;
  border-radius: 50%;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  z-index: 3;
}

.song-info {
  text-align: center;
  margin-top: 22px;
}

#title {
  font-size: 23px;
  font-weight: bold;
  margin-bottom: 7px;
}

#artist {
  color: #999;
  font-size: 14px;
}

audio {
  display: none;
}

.progress-area {
  margin-top: 25px;
}

.progress {
  width: 100%;
  height: 5px;
  appearance: none;
  background: #333;
  border-radius: 5px;
  cursor: pointer;
}

.progress::-webkit-slider-thumb {
  appearance: none;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: white;
}

.time {
  display: flex;
  justify-content: space-between;
  color: #888;
  font-size: 11px;
  margin-top: 7px;
}

.controls {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 18px;
  margin: 25px 0;
}

.controls button {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  border: 1px solid #555;
  background: #090909;
  color: white;
  cursor: pointer;
  font-size: 17px;
  transition: 0.2s;
}

.controls button:hover {
  background: #222;
  border-color: white;
}

.controls .play {
  width: 62px;
  height: 62px;
  font-size: 22px;
  background: white;
  color: black;
  border: none;
}

.controls .play:hover {
  background: #ddd;
}

.playlist {
  margin-top: 20px;
}

.playlist-title {
  font-size: 12px;
  color: #777;
  letter-spacing: 2px;
  margin-bottom: 10px;
  text-transform: uppercase;
}

.song {
  padding: 14px;
  border: 1px solid #222;
  background: rgba(10,10,10,0.8);
  margin-bottom: 8px;
  border-radius: 8px;
  cursor: pointer;
  transition: 0.2s;
}

.song:hover,
.song.active {
  border-color: #666;
  background: #181818;
}

.song-name {
  font-size: 14px;
  font-weight: bold;
}

.song-artist {
  font-size: 11px;
  color: #777;
  margin-top: 4px;
}

footer {
  text-align: center;
  color: #444;
  font-size: 10px;
  margin-top: 30px;
  letter-spacing: 2px;
}
</style>
</head>

<body>

<div class="bg-text bg1">NIRVANA</div>
<div class="bg-text bg2">DEFTONES</div>
<div class="bg-text bg3">THREE DAYS GRACE</div>

<div class="container">

  <div class="tags">
    <div class="tag">NIRVANA</div>
    <div class="tag">DEFTONES</div>
    <div class="tag">THREE DAYS GRACE</div>
  </div>

  <h1>Rock Player</h1>

  <div class="cover">
    <img id="coverImage" src="heart-shaped-box.jpg" alt="Album Cover">
  </div>

  <div class="song-info">
    <div id="title">Heart-Shaped Box</div>
    <div id="artist">Nirvana</div>
  </div>

  <div class="progress-area">
    <input
      type="range"
      id="progress"
      class="progress"
      value="0"
      min="0"
      max="100"
    >

    <div class="time">
      <span id="currentTime">0:00</span>
      <span id="duration">0:00</span>
    </div>
  </div>

  <audio id="audio"></audio>

  <div class="controls">
    <button onclick="prevSong()">⏮</button>
    <button class="play" onclick="togglePlay()" id="playBtn">▶</button>
    <button onclick="nextSong()">⏭</button>
  </div>

  <div class="playlist">
    <div class="playlist-title">Playlist</div>
    <div id="playlist"></div>
  </div>

  <footer>
    ROCK PLAYER
  </footer>

</div>

<script>

const songs = [

  {
    title: "Heart-Shaped Box",
    artist: "Nirvana",
    url: "8_144453842814116031.mp3",
    cover: "heart-shaped-box.jpg"
  },

  {
    title: "Pink Maggit",
    artist: "Deftones",
    url: "8_144492326763558406.mp3",
    cover: "pink-maggit.jpg"
  },

  {
    title: "Kill Me Fast",
    artist: "Three Days Grace",
    url: "Kill%20Me%20Fast.mp3",
    cover: "kill-me-fast.jpg"
  }

];

let currentSong = 0;

const audio = document.getElementById("audio");
const title = document.getElementById("title");
const artist = document.getElementById("artist");
const coverImage = document.getElementById("coverImage");
const playBtn = document.getElementById("playBtn");
const progress = document.getElementById("progress");
const currentTime = document.getElementById("currentTime");
const duration = document.getElementById("duration");
const playlist = document.getElementById("playlist");

function loadSong(index) {

  currentSong = index;

  const song = songs[index];

  title.textContent = song.title;
  artist.textContent = song.artist;

  audio.src = song.url;

  coverImage.src = song.cover;
  coverImage.alt = song.title + " - " + song.artist;

  progress.value = 0;
  currentTime.textContent = "0:00";
  duration.textContent = "0:00";

  updatePlaylist();
}

function togglePlay() {

  if (audio.paused) {

    audio.play();
    playBtn.textContent = "❚❚";

  } else {

    audio.pause();
    playBtn.textContent = "▶";

  }

}

function nextSong() {

  currentSong++;

  if (currentSong >= songs.length) {
    currentSong = 0;
  }

  loadSong(currentSong);

  audio.play();

  playBtn.textContent = "❚❚";
}

function prevSong() {

  currentSong--;

  if (currentSong < 0) {
    currentSong = songs.length - 1;
  }

  loadSong(currentSong);

  audio.play();

  playBtn.textContent = "❚❚";
}

function updatePlaylist() {

  playlist.innerHTML = "";

  songs.forEach((song, index) => {

    const div = document.createElement("div");

    div.className = "song";

    if (index === currentSong) {
      div.classList.add("active");
    }

    div.innerHTML = `
      <div class="song-name">${song.title}</div>
      <div class="song-artist">${song.artist}</div>
    `;

    div.onclick = function() {

      loadSong(index);

      audio.play();

      playBtn.textContent = "❚❚";

    };

    playlist.appendChild(div);

  });

}

audio.addEventListener("loadedmetadata", function() {

  duration.textContent =
    formatTime(audio.duration);

});

audio.addEventListener("timeupdate", function() {

  if (!audio.duration) return;

  progress.value =
    (audio.currentTime / audio.duration) * 100;

  currentTime.textContent =
    formatTime(audio.currentTime);

});

progress.addEventListener("input", function() {

  if (!audio.duration) return;

  audio.currentTime =
    (progress.value / 100) * audio.duration;

});

audio.addEventListener("ended", function() {

  nextSong();

});

function formatTime(seconds) {

  if (isNaN(seconds)) {
    return "0:00";
  }

  const minutes = Math.floor(seconds / 60);

  const secs = Math.floor(seconds % 60);

  return minutes + ":" +
    (secs < 10 ? "0" : "") +
    secs;
}

loadSong(0);

</script>

</body>
</html>
