<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dark Rock Player</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    background:
        radial-gradient(circle at 50% 20%, #252525 0%, #0b0b0b 38%, #000 75%);
    color: #fff;
    font-family: Arial, Helvetica, sans-serif;
    overflow-x: hidden;
}

/* Background */
body::before {
    content: "NIRVANA     DEFTONES     THREE DAYS GRACE";
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: rgba(255,255,255,0.025);
    font-size: clamp(35px, 7vw, 100px);
    font-weight: 900;
    transform: rotate(-12deg);
    white-space: nowrap;
    pointer-events: none;
    z-index: -2;
}

/* Guitar-string effect */
body::after {
    content: "";
    position: fixed;
    inset: 0;
    background:
        repeating-linear-gradient(
            90deg,
            transparent 0px,
            transparent 70px,
            rgba(255,255,255,0.025) 71px,
            transparent 72px
        );
    pointer-events: none;
    z-index: -1;
}

.player {
    width: min(440px, 94%);
    margin: 35px auto;
    padding: 24px;
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 28px;
    background: rgba(12,12,12,0.88);
    backdrop-filter: blur(16px);
    box-shadow:
        0 25px 80px rgba(0,0,0,0.75),
        inset 0 1px 0 rgba(255,255,255,0.06);
}

/* Header */
.header {
    text-align: center;
    margin-bottom: 22px;
}

.header h1 {
    font-size: 15px;
    letter-spacing: 5px;
    color: #aaa;
    text-transform: uppercase;
}

.header p {
    margin-top: 7px;
    font-size: 11px;
    color: #555;
    letter-spacing: 2px;
}

/* Cover */
.cover-wrap {
    position: relative;
    width: 270px;
    height: 270px;
    margin: 0 auto 25px;
}

.cover-glow {
    position: absolute;
    inset: 12px;
    border-radius: 50%;
    background: #777;
    filter: blur(35px);
    opacity: 0.25;
    transition: 0.6s;
}

.cover-wrap.playing .cover-glow {
    opacity: 0.55;
    transform: scale(1.08);
}

.cover {
    position: relative;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    overflow: hidden;
    border: 2px solid rgba(255,255,255,0.15);
    box-shadow:
        0 0 0 7px rgba(255,255,255,0.025),
        0 20px 50px rgba(0,0,0,0.8);
    animation: spin 16s linear infinite;
    animation-play-state: paused;
}

.cover-wrap.playing .cover {
    animation-play-state: running;
}

.cover img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

/* Center circle */
.cover::after {
    content: "";
    position: absolute;
    width: 20px;
    height: 20px;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: #080808;
    border: 4px solid #222;
    box-shadow: 0 0 0 2px #555;
}

@keyframes spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
}

/* Song info */
.song-info {
    text-align: center;
    margin-bottom: 20px;
}

.song-info h2 {
    font-size: 25px;
    margin-bottom: 7px;
}

.song-info p {
    color: #888;
    font-size: 14px;
}

/* Visualizer */
.visualizer {
    height: 45px;
    display: flex;
    justify-content: center;
    align-items: end;
    gap: 4px;
    margin: 12px 0 18px;
}

.bar {
    width: 4px;
    height: 8px;
    background: #aaa;
    border-radius: 5px;
    animation: visual 0.7s ease-in-out infinite alternate;
    animation-play-state: paused;
}

.bar:nth-child(2) { animation-delay: .1s; }
.bar:nth-child(3) { animation-delay: .2s; }
.bar:nth-child(4) { animation-delay: .3s; }
.bar:nth-child(5) { animation-delay: .4s; }
.bar:nth-child(6) { animation-delay: .2s; }
.bar:nth-child(7) { animation-delay: .1s; }
.bar:nth-child(8) { animation-delay: .3s; }

.player.playing .bar {
    animation-play-state: running;
}

@keyframes visual {
    from { height: 7px; }
    to { height: 38px; }
}

/* Progress */
.progress-area {
    margin-top: 5px;
}

.time {
    display: flex;
    justify-content: space-between;
    color: #666;
    font-size: 11px;
    margin-bottom: 7px;
}

input[type="range"] {
    width: 100%;
    accent-color: #aaa;
    cursor: pointer;
}

/* Controls */
.controls {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 22px;
    margin: 22px 0;
}

.control {
    width: 45px;
    height: 45px;
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 50%;
    background: #171717;
    color: #fff;
    cursor: pointer;
    font-size: 17px;
    transition: .2s;
}

.control:hover {
    transform: scale(1.08);
    background: #252525;
}

.play {
    width: 64px;
    height: 64px;
    font-size: 23px;
    background: #eee;
    color: #000;
    border: none;
    box-shadow: 0 0 25px rgba(255,255,255,0.12);
}

.play:hover {
    background: #fff;
}

/* Volume */
.volume {
    display: flex;
    align-items: center;
    gap: 10px;
    color: #777;
    font-size: 14px;
    margin-bottom: 24px;
}

.volume input {
    flex: 1;
}

/* Playlist */
.playlist-title {
    font-size: 11px;
    color: #555;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 10px;
}

.playlist {
    display: flex;
    flex-direction: column;
    gap: 7px;
}

.track {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px;
    border-radius: 13px;
    cursor: pointer;
    transition: .25s;
    border: 1px solid transparent;
}

.track:hover {
    background: rgba(255,255,255,0.05);
}

.track.active {
    background: rgba(255,255,255,0.08);
    border-color: rgba(255,255,255,0.1);
}

.track img {
    width: 48px;
    height: 48px;
    object-fit: cover;
    border-radius: 9px;
}

.track-info {
    flex: 1;
    min-width: 0;
}

.track-info strong {
    display: block;
    font-size: 14px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.track-info span {
    display: block;
    color: #666;
    font-size: 11px;
    margin-top: 4px;
}

.track-number {
    color: #555;
    font-size: 11px;
}

/* Footer */
.footer {
    text-align: center;
    color: #444;
    font-size: 10px;
    margin-top: 25px;
    letter-spacing: 2px;
}

/* Mobile */
@media (max-width: 480px) {
    .player {
        margin: 15px auto;
        padding: 18px;
        border-radius: 22px;
    }

    .cover-wrap {
        width: 235px;
        height: 235px;
    }

    .song-info h2 {
        font-size: 21px;
    }

    .controls {
        gap: 14px;
    }
}
</style>
</head>

<body>

<div class="player" id="player">

    <div class="header">
        <h1>Dark Rock Player</h1>
        <p>TURN IT UP</p>
    </div>

    <div class="cover-wrap" id="coverWrap">
        <div class="cover-glow"></div>

        <div class="cover">
            <img id="coverImage"
                 src="f85c6b753d8aaba1aaee705201dac270.jpg"
                 alt="Album Cover">
        </div>
    </div>

    <div class="song-info">
        <h2 id="title">Heart-Shaped Box</h2>
        <p id="artist">Nirvana</p>
    </div>

    <div class="visualizer">
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
    </div>

    <audio id="audio"></audio>

    <div class="progress-area">
        <div class="time">
            <span id="currentTime">0:00</span>
            <span id="duration">0:00</span>
        </div>

        <input type="range"
               id="progress"
               min="0"
               max="100"
               value="0">
    </div>

    <div class="controls">
        <button class="control" id="prev">⏮</button>
        <button class="control play" id="play">▶</button>
        <button class="control" id="next">⏭</button>
    </div>

    <div class="volume">
        <span>🔊</span>
        <input type="range"
               id="volume"
               min="0"
               max="1"
               step="0.01"
               value="0.8">
    </div>

    <div class="playlist-title">Playlist</div>

    <div class="playlist" id="playlist"></div>

    <div class="footer">
        MADE FOR LOUD MUSIC
    </div>

</div>

<script>

const songs = [

    {
        title: "Heart-Shaped Box",
        artist: "Nirvana",
        url: "8_144453842814116031.mp3",
        cover: "f85c6b753d8aaba1aaee705201dac270.jpg"
    },

    {
        title: "Pink Maggit",
        artist: "Deftones",
        url: "8_144492326763558406.mp3",
        cover: "9783d4b54a4a2651eeb5125621dd15a5.jpg"
    },

    {
        title: "Kill Me Fast",
        artist: "Three Days Grace",
        url: "Kill%20Me%20Fast.mp3",
        cover: "cropped-cover.avif"
    }

];

const audio = document.getElementById("audio");
const playBtn = document.getElementById("play");
const prevBtn = document.getElementById("prev");
const nextBtn = document.getElementById("next");

const title = document.getElementById("title");
const artist = document.getElementById("artist");
const coverImage = document.getElementById("coverImage");
const coverWrap = document.getElementById("coverWrap");

const progress = document.getElementById("progress");
const currentTime = document.getElementById("currentTime");
const duration = document.getElementById("duration");

const volume = document.getElementById("volume");
const playlist = document.getElementById("playlist");
const player = document.getElementById("player");

let currentIndex = 0;

audio.volume = 0.8;

function formatTime(seconds) {
    if (!Number.isFinite(seconds)) return "0:00";

    const minutes = Math.floor(seconds / 60);
    const secs = Math.floor(seconds % 60);

    return minutes + ":" + String(secs).padStart(2, "0");
}

function loadSong(index) {

    currentIndex = index;

    const song = songs[index];

    title.textContent = song.title;
    artist.textContent = song.artist;

    audio.src = song.url;

    coverImage.src = song.cover;
    coverImage.alt = song.title + " - " + song.artist;

    progress.value = 0;

    updatePlaylist();

    document.title = song.title + " — " + song.artist;
}

function playSong() {

    audio.play();

    playBtn.textContent = "⏸";

    player.classList.add("playing");
    coverWrap.classList.add("playing");
}

function pauseSong() {

    audio.pause();

    playBtn.textContent = "▶";

    player.classList.remove("playing");
    coverWrap.classList.remove("playing");
}

playBtn.addEventListener("click", () => {

    if (audio.paused) {
        playSong();
    } else {
        pauseSong();
    }

});

prevBtn.addEventListener("click", () => {

    currentIndex--;

    if (currentIndex < 0) {
        currentIndex = songs.length - 1;
    }

    loadSong(currentIndex);
    playSong();

});

nextBtn.addEventListener("click", () => {

    currentIndex++;

    if (currentIndex >= songs.length) {
        currentIndex = 0;
    }

    loadSong(currentIndex);
    playSong();

});

audio.addEventListener("timeupdate", () => {

    if (audio.duration) {

        progress.value =
            (audio.currentTime / audio.duration) * 100;

    }

    currentTime.textContent =
        formatTime(audio.currentTime);

});

audio.addEventListener("loadedmetadata", () => {

    duration.textContent =
        formatTime(audio.duration);

});

progress.addEventListener("input", () => {

    if (audio.duration) {

        audio.currentTime =
            (progress.value / 100) * audio.duration;

    }

});

volume.addEventListener("input", () => {

    audio.volume = volume.value;

});

audio.addEventListener("ended", () => {

    currentIndex++;

    if (currentIndex >= songs.length) {
        currentIndex = 0;
    }

    loadSong(currentIndex);
    playSong();

});

function updatePlaylist() {

    playlist.innerHTML = "";

    songs.forEach((song, index) => {

        const track = document.createElement("div");

        track.className =
            "track" +
            (index === currentIndex ? " active" : "");

        track.innerHTML = `
            <img src="${song.cover}" alt="">
            <div class="track-info">
                <strong>${song.title}</strong>
                <span>${song.artist}</span>
            </div>
            <div class="track-number">
                ${String(index + 1).padStart(2, "0")}
            </div>
        `;

        track.addEventListener("click", () => {

            loadSong(index);
            playSong();

        });

        playlist.appendChild(track);

    });

}

loadSong(0);

</script>

</body>
</html>
