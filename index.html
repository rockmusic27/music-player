<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rock Player</title>

<style>
* {
  box-sizing: border-box;
}

:root {
  --bg: #050505;
  --panel: rgba(18,18,18,.78);
  --line: rgba(255,255,255,.12);
  --text: #f5f5f5;
  --muted: #888;
}

body {
  margin: 0;
  min-height: 100vh;
  color: var(--text);
  font-family: Arial, Helvetica, sans-serif;
  background:
    radial-gradient(circle at 50% 25%, #292929 0%, transparent 28%),
    radial-gradient(circle at 10% 90%, #151515 0%, transparent 30%),
    radial-gradient(circle at 90% 70%, #111 0%, transparent 30%),
    #030303;
  overflow-x: hidden;
}

/* Grain */
body::after {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  opacity: .06;
  background-image:
    repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      #fff 3px
    );
  z-index: 20;
}

/* Guitar strings */
.strings {
  position: fixed;
  inset: 0;
  pointer-events: none;
  opacity: .12;
  z-index: 0;
}

.strings span {
  position: absolute;
  top: 0;
  bottom: 0;
  width: 1px;
  background: linear-gradient(
    to bottom,
    transparent,
    #fff,
    transparent
  );
}

/* Background typography */
.bg {
  position: fixed;
  font-size: clamp(70px, 13vw, 180px);
  font-weight: 900;
  letter-spacing: 12px;
  color: rgba(255,255,255,.025);
  pointer-events: none;
  user-select: none;
  z-index: 0;
  white-space: nowrap;
}

.bg.one {
  top: 4%;
  left: -20px;
  transform: rotate(-8deg);
}

.bg.two {
  bottom: 10%;
  right: -40px;
  transform: rotate(8deg);
}

.container {
  position: relative;
  z-index: 2;
  width: min(94%, 560px);
  margin: auto;
  padding: 28px 0 45px;
}

/* Top */
.top {
  text-align: center;
  margin-bottom: 24px;
}

.logo {
  font-size: 11px;
  letter-spacing: 6px;
  color: #777;
  margin-bottom: 8px;
}

h1 {
  margin: 0;
  font-size: clamp(30px, 8vw, 48px);
  letter-spacing: 5px;
  font-weight: 900;
  text-transform: uppercase;
}

.subtitle {
  margin-top: 8px;
  color: #666;
  font-size: 11px;
  letter-spacing: 3px;
}

/* Player card */
.player {
  position: relative;
  padding: 25px 20px 22px;
  border: 1px solid var(--line);
  border-radius: 24px;
  background: var(--panel);
  backdrop-filter: blur(18px);
  box-shadow:
    0 30px 80px rgba(0,0,0,.7),
    inset 0 1px rgba(255,255,255,.05);
}

/* Cover */
.cover-wrap {
  width: min(78vw, 310px);
  height: min(78vw, 310px);
  margin: 5px auto 25px;
  position: relative;
}

.cover-glow {
  position: absolute;
  inset: 12%;
  border-radius: 50%;
  background: #aaa;
  filter: blur(45px);
  opacity: .12;
}

.cover {
  position: relative;
  width: 100%;
  height: 100%;
  border-radius: 50%;
  overflow: hidden;
  border: 2px solid #555;
  background:
    radial-gradient(
      circle at 50% 50%,
      #3b3b3b 0 3%,
      #151515 4% 18%,
      #080808 19% 35%,
      #181818 36% 37%,
      #050505 38% 52%,
      #202020 53% 54%,
      #080808 55% 100%
    );
  box-shadow:
    0 0 0 7px rgba(255,255,255,.025),
    0 20px 60px rgba(0,0,0,.8);
  animation: spin 14s linear infinite;
  animation-play-state: paused;
}

.cover.playing {
  animation-play-state: running;
}

.cover::before {
  content: "ROCK";
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  font-size: clamp(35px, 9vw, 55px);
  font-weight: 900;
  letter-spacing: 9px;
  color: rgba(255,255,255,.12);
  transform: rotate(-18deg);
}

.cover::after {
  content: "";
  position: absolute;
  width: 140%;
  height: 2px;
  left: -20%;
  top: 50%;
  background: rgba(255,255,255,.14);
  box-shadow:
    0 25px rgba(255,255,255,.07),
    0 -25px rgba(255,255,255,.07);
  transform: rotate(-25deg);
}

@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}

/* Song info */
.song-info {
  text-align: center;
}

#title {
  font-size: clamp(20px, 6vw, 27px);
  font-weight: 800;
  letter-spacing: 1px;
}

#artist {
  margin-top: 7px;
  color: #888;
  font-size: 13px;
  letter-spacing: 2px;
  text-transform: uppercase;
}

/* Visualizer */
.visualizer {
  height: 32px;
  display: flex;
  justify-content: center;
  align-items: end;
  gap: 4px;
  margin: 18px 0 8px;
}

.bar {
  width: 4px;
  height: 8px;
  background: #aaa;
  border-radius: 3px;
  animation: bars .8s ease-in-out infinite alternate;
  animation-play-state: paused;
}

.bar:nth-child(2) { animation-delay: -.2s; }
.bar:nth-child(3) { animation-delay: -.5s; }
.bar:nth-child(4) { animation-delay: -.1s; }
.bar:nth-child(5) { animation-delay: -.7s; }
.bar:nth-child(6) { animation-delay: -.3s; }
.bar:nth-child(7) { animation-delay: -.6s; }
.bar:nth-child(8) { animation-delay: -.2s; }
.bar:nth-child(9) { animation-delay: -.4s; }
.bar:nth-child(10) { animation-delay: -.8s; }

.visualizer.playing .bar {
  animation-play-state: running;
}

@keyframes bars {
  from { height: 5px; }
  to { height: 30px; }
}

/* Progress */
.progress-box {
  margin-top: 8px;
}

.progress {
  width: 100%;
  height: 5px;
  appearance: none;
  background: #292929;
  border-radius: 10px;
  cursor: pointer;
}

.progress::-webkit-slider-thumb {
  appearance: none;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: #fff;
  box-shadow: 0 0 12px rgba(255,255,255,.4);
}

.time {
  display: flex;
  justify-content: space-between;
  color: #666;
  font-size: 10px;
  margin-top: 8px;
  letter-spacing: 1px;
}

/* Controls */
.controls {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 16px;
  margin: 24px 0;
}

.controls button {
  width: 48px;
  height: 48px;
  border: 1px solid #333;
  border-radius: 50%;
  background: #0a0a0a;
  color: white;
  cursor: pointer;
  font-size: 17px;
  transition: .2s;
}

.controls button:hover {
  transform: translateY(-2px);
  border-color: #888;
  background: #1b1b1b;
}

.controls .play {
  width: 66px;
  height: 66px;
  border: none;
  background: white;
  color: black;
  font-size: 21px;
  box-shadow: 0 8px 25px rgba(0,0,0,.5);
}

.controls .play:hover {
  background: #ddd;
}

/* Playlist */
.playlist-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin: 10px 2px 12px;
}

.playlist-header span:first-child {
  font-size: 11px;
  letter-spacing: 3px;
  color: #777;
}

.playlist-header span:last-child {
  font-size: 10px;
  color: #444;
}

.song {
  position: relative;
  display: flex;
  align-items: center;
  gap: 13px;
  padding: 14px;
  margin-bottom: 8px;
  border: 1px solid #1e1e1e;
  border-radius: 13px;
  background: rgba(5,5,5,.7);
  cursor: pointer;
  transition: .2s;
}

.song:hover {
  border-color: #444;
  transform: translateX(3px);
}

.song.active {
  background: #171717;
  border-color: #555;
}

.song-number {
  width: 30px;
  height: 30px;
  display: grid;
  place-items: center;
  border: 1px solid #333;
  border-radius: 50%;
  color: #777;
  font-size: 10px;
}

.song.active .song-number {
  background: white;
  color: black;
}

.song-info-small {
  flex: 1;
}

.song-name {
  font-size: 14px;
  font-weight: 700;
}

.song-artist {
  margin-top: 4px;
  color: #666;
  font-size: 10px;
  letter-spacing: 1px;
  text-transform: uppercase;
}

.song-arrow {
  color: #444;
  font-size: 14px;
}

footer {
  text-align: center;
  color: #333;
  font-size: 9px;
  letter-spacing: 4px;
  margin-top: 25px;
}

@media (max-width: 400px) {
  .player {
    padding: 20px 15px;
  }

  .controls {
    gap: 11px;
  }
}
</style>
</head>

<body>

  <span style="left:50%"></span>

<div class="bg one">NIRVANA</div>

<div class="container">

    <audio id="audio"></audio>

  <footer>
    ROCK PLAYER • 2026

</div>

    title: "Kill Me Fast",

const cover = document.getElementById("cover");

function loadSong(index) {

  currentSong = index;

  const song = songs[index];

  title.textContent = song.title;
  artist.textContent = song.artist;

  audio.src = song.url;

  updatePlaylist();

  progress.value = 0;
  currentTime.textContent = "0:00";
  duration.textContent = "0:00";
}

function togglePlay() {

  if (audio.paused) {
    audio.play()
      .then(() => setPlaying(true))
      .catch(() => {});
  } else {
    audio.pause();
    setPlaying(false);
  }
}

function setPlaying(isPlaying) {

  playBtn.textContent = isPlaying ? "❚❚" : "▶";

  if (isPlaying) {
    cover.classList.add("playing");
    visualizer.classList.add("playing");
  } else {
    cover.classList.remove("playing");
    visualizer.classList.remove("playing");
  }
}

  if (currentSong >= songs.length) {
    currentSong = 0;
  }
