<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dark Rock Player</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    background:
        radial-gradient(circle at 15% 20%, #4a4a4a 0%, transparent 28%),
        radial-gradient(circle at 85% 75%, #303030 0%, transparent 30%),
        linear-gradient(135deg, #353535 0%, #151515 45%, #050505 100%);
    color: white;
    font-family: Arial, Helvetica, sans-serif;
    overflow-x: hidden;
}

/* Background texture */
body::before {
    content: "";
    position: fixed;
    inset: 0;
    background:
        repeating-linear-gradient(
            90deg,
            transparent 0px,
            transparent 80px,
            rgba(255,255,255,0.02) 81px,
            transparent 82px
        );
    pointer-events: none;
    z-index: -5;
}

/* Background text */
body::after {
    content: "NIRVANA     DEFTONES     THREE DAYS GRACE";
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: rgba(255,255,255,0.025);
    font-size: clamp(35px, 7vw, 100px);
    font-weight: 900;
    transform: rotate(-12deg);
    white-space: nowrap;
    pointer-events: none;
    z-index: -4;
}

/* LEFT GUITAR */
.guitar-left {
    position: fixed;
    top: 25px;
    left: 15px;
    width: 190px;
    height: 190px;
    transform: rotate(-22deg);
    pointer-events: none;
    z-index: -1;
}

/* RIGHT GUITAR */
.guitar-right {
    position: fixed;
    top: 25px;
    right: 15px;
    width: 190px;
    height: 190px;
    transform: scaleX(-1) rotate(-22deg);
    pointer-events: none;
    z-index: -1;
}

.guitar-left svg,
.guitar-right svg {
    width: 100%;
    height: 100%;
    filter: drop-shadow(0 8px 18px rgba(0,0,0,0.8));
}

/* PLAYER */
.player {
    position: relative;
    z-index: 2;
    width: min(440px, 94%);
    margin: 35px auto;
    padding: 24px;

    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 28px;

    background: rgba(12,12,12,0.9);

    backdrop-filter: blur(16px);

    box-shadow:
        0 25px 80px rgba(0,0,0,0.8),
        inset 0 1px 0 rgba(255,255,255,0.06);
}

/* COVER */
.cover {
    width: 260px;
    height: 260px;
    margin: 0 auto 22px;

    border-radius: 50%;
    overflow: hidden;

    border: 5px solid #252525;

    box-shadow:
        0 0 35px rgba(255,255,255,0.12),
        0 20px 40px rgba(0,0,0,0.8);

    transition: 0.3s;
}

.cover img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.player.playing .cover {
    animation: spin 10s linear infinite;
}

@keyframes spin {
    from {
        transform: rotate(0deg);
    }
    to {
        transform: rotate(360deg);
    }
}

/* SONG INFO */
.song-info {
    text-align: center;
    margin-bottom: 18px;
}

.song-info h1 {
    font-size: 24px;
    margin-bottom: 7px;
}

.song-info p {
    color: #999;
    font-size: 15px;
}

/* PROGRESS */
.progress-container {
    margin-top: 10px;
}

.progress {
    width: 100%;
    accent-color: #aaa;
    cursor: pointer;
}

.time {
    display: flex;
    justify-content: space-between;
    color: #777;
    font-size: 12px;
    margin-top: 5px;
}

/* CONTROLS */
.controls {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 20px;
    margin: 22px 0;
}

.controls button {
    border: none;
    width: 48px;
    height: 48px;
    border-radius: 50%;

    background: #242424;
    color: white;

    font-size: 18px;
    cursor: pointer;

    transition: 0.2s;

    box-shadow:
        0 5px 15px rgba(0,0,0,0.5);
}

.controls button:hover {
    background: #444;
    transform: scale(1.08);
}

.controls .play {
    width: 62px;
    height: 62px;
    font-size: 24px;
    background: #eeeeee;
    color: #111;
}

.controls .play:hover {
    background: white;
}

/* VISUALIZER */
.visualizer {
    height: 45px;
    display: flex;
    justify-content: center;
    align-items: flex-end;
    gap: 5px;
    margin: 15px 0 20px;
}

.bar {
    width: 5px;
    height: 10px;
    background: #777;
    border-radius: 5px;
}

.player.playing .bar {
    animation: bounce 0.7s ease-in-out infinite alternate;
}

.bar:nth-child(2) { animation-delay: 0.1s; }
.bar:nth-child(3) { animation-delay: 0.2s; }
.bar:nth-child(4) { animation-delay: 0.3s; }
.bar:nth-child(5) { animation-delay: 0.4s; }
.bar:nth-child(6) { animation-delay: 0.2s; }
.bar:nth-child(7) { animation-delay: 0.1s; }

@keyframes bounce {
    from {
        height: 8px;
    }
    to {
        height: 42px;
    }
}

/* PLAYLIST */
.playlist {
    margin-top: 15px;
}

.playlist-title {
    font-size: 13px;
    color: #777;
    text-transform: uppercase;
    letter-spacing: 2px;
    margin-bottom: 10px;
}

.track {
    display: flex;
    align-items: center;
    gap: 12px;

    padding: 10px;
    margin-bottom: 7px;

    border-radius: 13px;

    background: rgba(255,255,255,0.04);

    cursor: pointer;
    transition: 0.2s;
}

.track:hover {
    background: rgba(255,255,255,0.09);
}

.track.active {
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.1);
}

.track img {
    width: 48px;
    height: 48px;
    border-radius: 8px;
    object-fit: cover;
}

.track-info {
    flex: 1;
}

.track-info strong {
    display: block;
    font-size: 14px;
}

.track-info span {
    display: block;
    color: #777;
    font-size: 12px;
    margin-top: 3px;
}

.track-number {
    color: #555;
    font-size: 12px;
}

/* MOBILE */
@media (max-width: 650px) {

    .player {
        margin-top: 100px;
    }

    .cover {
        width: 220px;
        height: 220px;
    }

    .guitar-left,
    .guitar-right {
        width: 125px;
        height: 125px;
        top: 15px;
    }

    .guitar-left {
        left: -5px;
    }

    .guitar-right {
        right: -5px;
    }
}
</style>
</head>

<body>

<!-- LEFT ELECTRIC GUITAR -->
<div class="guitar-left">
<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">

    <rect x="95" y="8" width="18" height="105"

    <circle cx="116" cy="9" r="3" fill="#aaa"/>
    <circle cx="96" cy="15" r="3" fill="#777"/>
    <circle cx="116" cy="17" r="3" fill="#777"/>

    <path d="M92 93
             C72 78 49 84 48 103
             C47 116 57 122 68 124
             C53 132 55 151 70 157
             C85 163 96 151 101 139
             C106 151 117 163 132 157
             C147 151 149 132 134 124
             C145 122 155 116 154 103

    <line x1="111" y1="5" x2="111" y2="145" stroke="#999" stroke-width="0.7"/>

</div>


<!-- RIGHT ELECTRIC GUITAR -->
<div class="guitar-right">
<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">

    <rect x="95" y="8" width="18" height="105"
          rx="4"
          fill="#151515"
          stroke="#999"
          stroke-width="2"/>

    <path d="M92 10 L100 2 L116 4 L121 13 L113 24 L94 21 Z"
          fill="#111"
          stroke="#aaa"
          stroke-width="2"/>

    <circle cx="96" cy="7" r="3" fill="#aaa"/>
    <circle cx="116" cy="9" r="3" fill="#aaa"/>
    <circle cx="96" cy="15" r="3" fill="#777"/>
    <circle cx="116" cy="17" r="3" fill="#777"/>

    <path d="M92 93
             C72 78 49 84 48 103
             C47 116 57 122 68 124
             C53 132 55 151 70 157
             C85 163 96 151 101 139
             C106 151 117 163 132 157
             C147 151 149 132 134 124
             C145 122 155 116 154 103
             C153 84 130 78 111 93 Z"
          fill="#202020"
          stroke="#aaa"
          stroke-width="3"/>

    <path d="M83 105
             C91 96 110 96 119 105
             L113 135
             C107 142 95 142 89 135 Z"
          fill="#353535"
          stroke="#999"
          stroke-width="1.5"/>

    <rect x="88" y="113" width="26" height="7" rx="2" fill="#aaa"/>
    <rect x="88" y="126" width="26" height="7" rx="2" fill="#666"/>
    <rect x="87" y="138" width="28" height="5" rx="2" fill="#999"/>

    <line x1="99" y1="5" x2="99" y2="145" stroke="#ccc" stroke-width="0.7"/>
    <line x1="103" y1="5" x2="103" y2="145" stroke="#999" stroke-width="0.7"/>
    <line x1="107" y1="5" x2="107" y2="145" stroke="#ccc" stroke-width="0.7"/>
    <line x1="111" y1="5" x2="111" y2="145" stroke="#999" stroke-width="0.7"/>

    <circle cx="76" cy="143" r="4" fill="#aaa"/>
    <circle cx="126" cy="143" r="4" fill="#aaa"/>

</svg>
</div>


<!-- PLAYER -->
<div class="player" id="player">

    <div class="cover">
        <img id="coverImage" src="" alt="Cover">
    </div>

    <div class="song-info">
        <h1 id="songTitle">Heart-Shaped Box</h1>
        <p id="songArtist">Nirvana</p>
    </div>

    <div class="progress-container">
        <input
            type="range"
            id="progress"
            class="progress"
            min="0"
            max="100"
            value="0"
        >

        <div class="time">
            <span id="currentTime">0:00</span>
            <span id="duration">0:00</span>
        </div>
    </div>

    <div class="controls">
        <button id="prevBtn">⏮</button>
        <button id="playBtn" class="play">▶</button>
        <button id="nextBtn">⏭</button>
    </div>

    <!-- VISUALIZER -->
    <div class="visualizer">
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
    </div>

    <!-- PLAYLIST -->
    <div class="playlist">
        <div class="playlist-title">Playlist</div>
        <div id="playlist"></div>
    </div>

</div>


<audio id="audio"></audio>


<script>

const songs = [

    {
        title: "Heart-Shaped Box",
        artist: "Nirvana",
        url: "8_144453842814116031.mp3",
        cover: "f85c6b753d8aaba1aaee705201dac270.jpg"
    },

    {
        title: "Pink Maggit",
        artist: "Deftones",
        url: "8_144492326763558406.mp3",
        cover: "9783d4b54a4a2651eeb5125621dd15a5.jpg"
    },

    {
        title: "Kill Me Fast",
        artist: "Three Days Grace",
        url: "Kill%20Me%20Fast.mp3",
        cover: "cropped-cover.avif"
    }

];


const audio = document.getElementById("audio");
const playBtn = document.getElementById("playBtn");
const prevBtn = document.getElementById("prevBtn");
const nextBtn = document.getElementById("nextBtn");

const songTitle = document.getElementById("songTitle");
const songArtist = document.getElementById("songArtist");

const coverImage = document.getElementById("coverImage");

const progress = document.getElementById("progress");
const currentTime = document.getElementById("currentTime");
const duration = document.getElementById("duration");

const playlist = document.getElementById("playlist");
const player = document.getElementById("player");


let currentIndex = 0;


/* FORMAT TIME */

function formatTime(seconds) {

    if (isNaN(seconds)) return "0:00";

    const minutes = Math.floor(seconds / 60);

    const secs = Math.floor(seconds % 60)
        .toString()
        .padStart(2, "0");

    return `${minutes}:${secs}`;
}


/* LOAD SONG */

function loadSong(index) {

    currentIndex = index;

    const song = songs[currentIndex];

    songTitle.textContent = song.title;
    songArtist.textContent = song.artist;

    audio.src = song.url;

    coverImage.src = song.cover;
    coverImage.alt = song.title;

    progress.value = 0;

    currentTime.textContent = "0:00";
    duration.textContent = "0:00";

    updatePlaylist();

    document.title = `${song.title} - ${song.artist}`;
}


/* PLAY */

function playSong() {

    audio.play();

    playBtn.textContent = "⏸";

    player.classList.add("playing");
}


/* PAUSE */

function pauseSong() {

    audio.pause();

    playBtn.textContent = "▶";

    player.classList.remove("playing");
}


/* PLAY BUTTON */

playBtn.addEventListener("click", () => {

    if (audio.paused) {
        playSong();
    } else {
        pauseSong();
    }

});


/* PREVIOUS */

prevBtn.addEventListener("click", () => {

    currentIndex--;

    if (currentIndex < 0) {
        currentIndex = songs.length - 1;
    }

    loadSong(currentIndex);
    playSong();

});


/* NEXT */

nextBtn.addEventListener("click", () => {

    currentIndex++;

    if (currentIndex >= songs.length) {
        currentIndex = 0;
    }

    loadSong(currentIndex);
    playSong();

});


/* TIME UPDATE */

audio.addEventListener("timeupdate", () => {

    if (!audio.duration) return;

    progress.value =
        (audio.currentTime / audio.duration) * 100;

    currentTime.textContent =
        formatTime(audio.currentTime);

});


/* METADATA */

audio.addEventListener("loadedmetadata", () => {

    duration.textContent =
        formatTime(audio.duration);

});


/* PROGRESS */

progress.addEventListener("input", () => {

    if (!audio.duration) return;

    audio.currentTime =
        (progress.value / 100) * audio.duration;

});


/* AUTO NEXT */

audio.addEventListener("ended", () => {

    currentIndex++;

    if (currentIndex >= songs.length) {
        currentIndex = 0;
    }

    loadSong(currentIndex);
    playSong();

});


/* PLAYLIST */

function updatePlaylist() {

    playlist.innerHTML = "";

    songs.forEach((song, index) => {

        const track = document.createElement("div");

        track.className =
            "track" +
            (index === currentIndex ? " active" : "");

        track.innerHTML = `
            <img src="${song.cover}" alt="">
            
            <div class="track-info">
                <strong>${song.title}</strong>
                <span>${song.artist}</span>
            </div>

            <div class="track-number">
                ${String(index + 1).padStart(2, "0")}
            </div>
        `;

        track.addEventListener("click", () => {

            loadSong(index);
            playSong();

        });

        playlist.appendChild(track);

    });

}


/* FIRST SONG */

loadSong(0);

</script>

</body>
</html>
