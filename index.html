<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Music</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

:root {
  --black: #080808;
  --dark: #101010;
  --panel: #171717;
  --gray: #8b8b8b;
  --white: #f5f5f5;
  --border: rgba(255,255,255,0.09);
}

body {
  min-height: 100vh;
  color: var(--white);
  font-family: Arial, Helvetica, sans-serif;
  overflow-x: hidden;

  background:
    linear-gradient(
      rgba(0,0,0,0.42),
      rgba(0,0,0,0.58)
    ),
    url("361db2becb4ced56a1af3109f6b026c3.jpg");

  background-size: cover;
  background-position: center;
  background-attachment: fixed;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;

  background:
    radial-gradient(
      circle at center,
      rgba(0,0,0,0.05),
      rgba(0,0,0,0.45)
    );

  pointer-events: none;
  z-index: 0;
}

.player {
  position: relative;
  z-index: 2;

  width: min(455px, 94%);
  margin: 35px auto;
  padding: 26px;

  border: 1px solid var(--border);
  border-radius: 30px;

  background: linear-gradient(
    145deg,
    rgba(40,40,40,0.82),
    rgba(10,10,10,0.90)
  );

  backdrop-filter: blur(14px);

  box-shadow:
    0 35px 100px rgba(0,0,0,0.8),
    inset 0 1px 0 rgba(255,255,255,0.07);
}

.player::before {
  content: "";
  position: absolute;
  top: 0;
  left: 12%;
  right: 12%;
  height: 1px;

  background: linear-gradient(
    90deg,
    transparent,
    rgba(255,255,255,0.35),
    transparent
  );
}

.music-header {
  text-align: center;
  margin-bottom: 24px;

  color: #f1f1f1;
  font-size: 22px;
  font-weight: 800;
  letter-spacing: 6px;
  text-transform: uppercase;

  text-shadow:
    0 2px 12px rgba(255,255,255,0.12);
}

.music-header span {
  color: #777;
}

.music-header .star {
  color: #fff;
  font-size: 16px;
  margin-right: 7px;
  vertical-align: 2px;

  text-shadow:
    0 0 10px rgba(255,255,255,0.35);
}

.cover {
  position: relative;

  width: 270px;
  height: 270px;

  margin: 5px auto 24px;

  border-radius: 50%;
  padding: 7px;

  background:
    linear-gradient(
      145deg,
      #777,
      #222 45%,
      #050505
    );

    0 0 0 1
