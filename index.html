<!DOCTYPE html>
<html>
<head>
  <title>Rock Player</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;

      display: flex;
      justify-content: center;
      align-items: center;
    }

    .box {
      background: #222;
      border: 2px solid white;
      border-radius: 20px;
      padding: 50px;
      text-align: center;
    }

    h1 {
      font-size: 40px;
      margin: 0 0 20px;
    }

    p {
      color: #aaa;
    }

    button {
      background: #000;
      color: white;
      border: 2px solid white;
      border-radius: 50%;
      width: 70px;
      height: 70px;
      font-size: 25px;
    }
  </style>
</head>

<body>

  <div class="box">
    <h1>ROCK PLAYER</h1>
    <p>NIRVANA • DEFTONES • THIRTY SECONDS TO MARS</p>
    <button>▶</button>
  </div>

</body>
</html>
