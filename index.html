<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Rock Music Player</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: #ffffff;

      background:
        radial-gradient(
          circle at 20% 10%,
          rgba(90, 90, 90, 0.35),
          transparent 30%
        ),
        radial-gradient(
          circle at 85% 85%,
          rgba(100, 20, 20, 0.25),
          transparent 35%
        ),
        linear-gradient(
          135deg,
          #020202 0%,
          #111111 50%,
          #292929 100%
        );

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 30px 15px;

      overflow-x: hidden;

      position: relative;
    }

    /* Guitar strings */
    body::before {
      content: "";

      position: fixed;

      top: -20%;
      right: 10%;

      width: 2px;
      height: 150%;

      background: rgba(255,255,255,0.12);

      transform: rotate(12deg);

      box-shadow:
        18px 0 rgba(255,255,255,0.08),
        36px 0 rgba(255,255,255,0.06),
        54px 0 rgba(255,255,255,0.05),
        72px 0 rgba(255,255,255,0.04);

      pointer-events: none;
    }

    /* Grunge texture */
    body::after {
      content: "";

      position: fixed;

      inset: 0;

      background:
        repeating-linear-gradient(
          0deg,
          transparent 0px,
          transparent 5px,
          rgba(255,255,255,0.018) 6px
        );

      pointer-events: none;
    }


    /* =========================
       MAIN PLAYER
       ========================= */

    .player {
      width: 100%;
      max-width: 440px;

      padding: 28px;

      background: rgba(8,8,8,0.90);

      border: 1px solid rgba(255,255,255,0.18);

      border-radius: 20px;

      box-shadow:
        0 25px 70px rgba(0,0,0,0.85),
        0 0 40px rgba(255,255,255,0.04);

      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);

      text-align: center;

      position: relative;

      z-index: 5;
    }


    /* =========================
       BAND NAMES
       ========================= */

    .bands {
      display: flex;

      justify-content: center;

      align-items: center;

      flex-wrap: wrap;

      gap: 7px;

      margin-bottom: 22px;
    }

    .band {
      font-size: 9px;

      letter-spacing: 1.7px;

      color: #cfcfcf;

      border: 1px solid rgba(255,255,255,0.18);

      background: rgba(255,255,255,0.04);

      padding: 7px 9px;

      border-radius: 20px;

      transition: 0.2s;
    }

    .band:hover {
      background: rgba(255,255,255,0.10);

      border-color: rgba(255,255,255,0.4);

      color: white;
    }


    /* =========================
       TITLE
       ========================= */

    h1 {
      margin: 0 0 24px;

      font-size: 25px;

      font-weight: 700;

      letter-spacing: 4px;

      text-transform: uppercase;

      text-shadow:
        2px 2px 0 #000,
        0 0 15px rgba(255,255,255,0.12);
