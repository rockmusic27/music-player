<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>My Music Player</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      font-family: Arial, sans-serif;
      color: white;

      background:
        radial-gradient(
          circle at 15% 15%,
          rgba(120, 20, 20, 0.35),
          transparent 30%
        ),
        radial-gradient(
          circle at 85% 85%,
          rgba(80, 80, 80, 0.25),
          transparent 35%
        ),
        linear-gradient(
          135deg,
          #030303 0%,
          #101010 45%,
          #292929 100%
        );

      position: relative;
      overflow-x: hidden;

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 20px;
    }

    /* Guitar-string style background */
    body::before {
      content: "";

      position: fixed;

      top: -20%;
      right: 8%;

      width: 2px;
      height: 140%;

      background: rgba(255, 255, 255, 0.12);

      transform: rotate(12deg);

      box-shadow:
        18px 0 rgba(255, 255, 255, 0.08),
        36px 0 rgba(255, 255, 255, 0.06),
        54px 0 rgba(255, 255, 255, 0.05);

      pointer-events: none;
    }

    /* Grunge lines */
    body::after {
      content: "";

      position: fixed;
      inset: 0;

      background:
        repeating-linear-gradient(
          0deg,
          transparent 0px,
          transparent 4px,
          rgba(255, 255, 255, 0.018) 5px
        );

      opacity: 0.7;

      pointer-events: none;
    }

    .player {
      width: 100%;
      max-width: 430px;

      padding: 28px;

      border-radius: 18px;

      background: rgba(10, 10, 10, 0.82);

      border: 1px solid rgba(255, 255, 255, 0.14);

      box-shadow:
        0 25px 70px rgba(0, 0, 0, 0.8),
        0 0 35px rgba(100, 20, 20, 0.15);

      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);

      text-align: center;

      position: relative;
      z-index: 2;
    }

    /* Band names */
    .band-strip {
      display: flex;

      flex-wrap: wrap;

      justify-content: center;

      gap: 8px;

      margin-bottom: 20px;
    }
